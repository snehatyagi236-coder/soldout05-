<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soldout05 - Online Shopping</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:20px;
}

.hero{
  background:white;
  padding:70px 25px;
  text-align:center;
}

.hero h1{
  font-size:42px;
  margin-bottom:15px;
}

.hero p{
  font-size:20px;
  margin-bottom:25px;
}

.button{
  display:inline-block;
  background:#111;
  color:white;
  padding:12px 25px;
  text-decoration:none;
  border-radius:6px;
}

.products{
  padding:40px 20px;
  max-width:1100px;
  margin:auto;
}

.products h2{
  text-align:center;
  font-size:32px;
  margin-bottom:30px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.product{
  background:white;
  padding:25px;
  text-align:center;
  border-radius:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.product-image{
  height:180px;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
  border-radius:8px;
  font-size:50px;
}

.product h3{
  font-size:22px;
  margin-bottom:10px;
}

.price{
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}

.buy{
  display:inline-block;
  background:#111;
  color:white;
  padding:10px 20px;
  border-radius:5px;
  text-decoration:none;
}

.contact{
  background:#111;
  color:white;
  text-align:center;
  padding:40px 20px;
  margin-top:30px;
}

@media(max-width:600px){
  header{
    flex-direction:column;
    gap:15px;
  }

  nav a{
    margin:0 8px;
  }

  .hero h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Soldout05</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="home">

<section class="hero">
  <h1>Welcome to Soldout05</h1>
  <p>Shop your favourite fashion items online.</p>
  <a class="button" href="#products">Shop Now</a>
</section>

<section class="products" id="products">
  <h2>Our Products</h2>

  <div class="product-grid">

    <article class="product">
      <div class="product-image">👕</div>
      <h3>T-Shirt</h3>
      <p class="price">₹499</p>
      <a class="buy" href="#contact">Buy Now</a>
    </article>

    <article class="product">
      <div class="product-image">👔</div>
      <h3>Shirt</h3>
      <p class="price">₹799</p>
      <a class="buy" href="#contact">Buy Now</a>
    </article>

    <article class="product">
      <div class="product-image">👖</div>
      <h3>Men Pant</h3>
      <p class="price">₹999</p>
      <a class="buy" href="#contact">Buy Now</a>
    </article>

  </div>
</section>

</main>

<section class="contact" id="contact">
  <h2>Contact Soldout05</h2>
  <p>Order ke liye humse contact karein.</p>
</section>

</body>
</html>
